<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>NexusView // AMOLED Immersive Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-amoled: #000000;
            --bg-surface: #05070a;
            --glass-bg: rgba(18, 22, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #3894ff;
            --primary-glow: rgba(56, 148, 255, 0.3);
            --text-main: #f0f3f6;
            --text-muted: #8c97a4;
            --blur-strength: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background-color: var(--bg-amoled);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphic Navigation Header */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border-bottom: 1px solid var(--glass-border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }

        body.pdf-active header {
            transform: translateY(-100%);
            position: absolute;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-cube {
            background: linear-gradient(135deg, var(--primary), #0052cc);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }

        /* Master View Grid Layout */
        .app-workspace {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 64px);
            position: relative;
        }

        body.pdf-active .app-workspace {
            height: 100vh;
        }

        /* Side Drawer for Recents (Desktop View Friendly) */
        .recents-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--glass-border);
            z-index: 250;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .recents-drawer.open { transform: translateX(0); }

        .drawer-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 800;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(56, 148, 255, 0.1);
            border-color: var(--primary);
        }

        /* Central Control Hub */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 32px 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            z-index: 10;
        }

        .file-input-container { position: relative; margin-top: 20px; }

        .real-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .glass-btn {
            background: linear-gradient(135deg, var(--primary), #1a73e8);
            border: none; color: #fff;
            padding: 14px 28px;
            font-weight: 600; font-size: 14px;
            border-radius: 10px; width: 100%;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Immersive Stream Viewport */
        .pdf-render-canvas-stream {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-amoled);
            scroll-behavior: smooth;
            padding-bottom: 80px; /* Spacer for menu overlay button */
            -webkit-overflow-scrolling: touch;
            will-change: transform;
        }
        
        body.pdf-active .pdf-render-canvas-stream {
            justify-content: flex-start;
        }
        
        body.pdf-active .pdf-render-canvas-stream:has(.pdf-page-canvas-node:nth-child(1):last-child) {
            justify-content: center;
        }

        /* Balanced Canvas Node Positioning */
        .pdf-page-canvas-node {
            width: 100%;
            max-width: 100%;
            height: auto !important;
            display: block;
            margin: 0 auto;
            background-color: #121212;
            content-visibility: auto;
            contain-intrinsic-size: 1000px;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 3-Dot Floating Context Overlay System */
        .action-hub-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 400;
            display: none;
        }

        body.pdf-active .action-hub-container { display: block; }

        .trigger-fab {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: var(--transition-smooth);
        }

        /* Floating Flyout Sheet */
        .action-context-menu {
            position: absolute;
            bottom: 64px;
            right: 0;
            background: rgba(15, 18, 25, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            width: 180px;
            padding: 8px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transform: scale(0.9) translateY(10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .action-context-menu.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .menu-opt-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-opt-btn:hover { background: rgba(255, 255, 255, 0.06); }
        .menu-opt-btn.danger-action { color: #ff6b6b; }

        .hidden { display: none !important; }

        .spinner {
            border: 2px solid rgba(255,255,255,0.05);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="brand">
            <div class="logo-cube">N</div>
            <h1>NexusView</h1>
        </div>
    </header>

    <div class="app-workspace">
        <div class="recents-drawer" id="recents-sidebar">
            <div class="drawer-title">Recent Handlers</div>
            <div class="history-list" id="history-render-root">
                <div class="history-item" style="color:var(--text-muted); text-align:center;pointer-events:none;">No records cached</div>
            </div>
        </div>

        <div class="center-hub" id="upload-hub-interface">
            <h2 style="font-size: 18px; margin-bottom: 8px;">NexusView Reader</h2>
            <p style="font-size: 13px; color: var(--text-muted);">AMOLED glassmorphic layout for immersive mobile reading.</p>
            
            <div class="file-input-container">
                <input type="file" id="pdf-file-handler" class="real-input" accept="application/pdf" />
                <button class="glass-btn">Open Local PDF</button>
            </div>
            <div id="processing-loader" class="hidden">
                <div class="spinner"></div>
                <p style="font-size:12px; color:var(--text-muted)">Generating hardware views...</p>
            </div>
        </div>

        <div class="pdf-render-canvas-stream" id="stream-viewport"></div>
    </div>

    <div class="action-hub-container" id="menu-hub-system">
        <div class="action-context-menu" id="flyout-menu-list">
            <button class="menu-opt-btn" id="opt-trigger-history">
                <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
                View Recents
            </button>
            <button class="menu-opt-btn danger-action" id="opt-trigger-close">
                <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                Close Document
            </button>
        </div>
        <div class="trigger-fab" id="master-menu-fab" title="Expand Menu Options">
            <svg style="width:22px;height:22px;fill:currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file-handler');
        const viewport = document.getElementById('stream-viewport');
        const uploadHub = document.getElementById('upload-hub-interface');
        const loader = document.getElementById('processing-loader');
        const recentsSidebar = document.getElementById('recents-sidebar');
        const historyRenderRoot = document.getElementById('history-render-root');
        
        // Menu Elements
        const masterFab = document.getElementById('master-menu-fab');
        const flyoutMenu = document.getElementById('flyout-menu-list');
        const optHistory = document.getElementById('opt-trigger-history');
        const optClose = document.getElementById('opt-trigger-close');

        let db = null;
        // Fix: Explicitly structured database initialization matching W3C specification framework
        function initDB(callback) {
            if (db) {
                if (callback) callback();
                return;
            }
            const dbRequest = indexedDB.open("NexusViewDB", 1);
            dbRequest.onupgradeneeded = (e) => {
                let databaseInstance = e.target.result;
                if(!databaseInstance.objectStoreNames.contains("pdf_history")) {
                    databaseInstance.createObjectStore("pdf_history", { keyPath: "id", autoIncrement: true });
                }
            };
            dbRequest.onsuccess = (e) => {
                db = e.target.result;
                db.onversionchange = () => {
                    db.close();
                    db = null;
                };
                if (callback) callback();
            };
            dbRequest.onerror = () => { console.error("Database framework mapping crashed."); };
        }
        initDB(() => { renderHistoryList(); });

        // Toggle Floating Menu Context Flyout Sheet
        masterFab.addEventListener('click', (e) => {
            e.stopPropagation();
            flyoutMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            flyoutMenu.classList.remove('active');
            recentsSidebar.classList.remove('open');
        });

        // Context Menu Action Allocations
        optHistory.addEventListener('click', (e) => {
            e.stopPropagation();
            flyoutMenu.classList.remove('active');
            recentsSidebar.classList.add('open');
        });

        optClose.addEventListener('click', () => {
            document.body.classList.remove('pdf-active');
            uploadHub.classList.remove('hidden');
            viewport.innerHTML = '';
            fileInput.value = '';
            flyoutMenu.classList.remove('active');
        });

        // Pipeline Core Parser Engine Logic
        async function processPDFBlob(fileBlob, fileName, saveToHistory = true) {
            if (!fileBlob) return;
            
            loader.classList.remove('hidden');
            viewport.innerHTML = '';

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    
                    loader.classList.add('hidden');
                    uploadHub.classList.add('hidden');
                    document.body.classList.add('pdf-active');

                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const baseViewport = page.getViewport({ scale: 1.0 });
                        
                        const deviceScreenWidth = window.innerWidth;
                        const dynamicScale = deviceScreenWidth / baseViewport.width;
                        const optimizedViewport = page.getViewport({ scale: Math.max(dynamicScale, 1.5) });

                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page-canvas-node';
                        const context = canvas.getContext('2d', { alpha: false, desynchronized: true });
                        
                        canvas.height = optimizedViewport.height;
                        canvas.width = optimizedViewport.width;
                        
                        viewport.appendChild(canvas);
                        await page.render({ canvasContext: context, viewport: optimizedViewport }).promise;
                    }

                    if(saveToHistory) storeInIndexedDB(fileBlob, fileName);

                } catch (err) {
                    alert("Pipeline rendering fault: " + err.message);
                    loader.classList.add('hidden');
                }
            };
            fileReader.readAsArrayBuffer(fileBlob);
        }

        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                processPDFBlob(e.target.files[0], e.target.files[0].name, true);
            }
        });

        // Memory Persistence Subsystem
        function storeInIndexedDB(blob, name) {
            initDB(() => {
                if (!db) return;
                try {
                    const transaction = db.transaction(["pdf_history"], "readwrite");
                    const store = transaction.objectStore("pdf_history");

                    store.getAll().onsuccess = (e) => {
                        let records = e.target.result;
                        const existingIndex = records.findIndex(r => r.name === name);
                        if(existingIndex !== -1) {
                            store.delete(records[existingIndex].id);
                        }
                        store.add({ name: name, binaryData: blob, timestamp: Date.now() });
                        if(records.length >= 10) store.delete(records[0].id);
                        renderHistoryList();
                    };
                } catch (ex) {
                    db = null;
                    initDB(() => { storeInIndexedDB(blob, name); });
                }
            });
        }

        function renderHistoryList() {
            initDB(() => {
                if(!db) return;
                try {
                    const store = db.transaction(["pdf_history"], "readonly").objectStore("pdf_history");
                    store.getAll().onsuccess = (e) => {
                        const results = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                        if(results.length === 0) return;

                        historyRenderRoot.innerHTML = '';
                        results.forEach(item => {
                            const el = document.createElement('div');
                            el.className = 'history-item';
                            el.textContent = item.name;
                            el.addEventListener('click', () => {
                                processPDFBlob(item.binaryData, item.name, false);
                            });
                            historyRenderRoot.appendChild(el);
                        });
                    };
                } catch (ex) {
                    db = null;
                }
            });
        }
    </script>
</body>
</html>
