<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusView // Premium Mobile PDF Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-surface: #0e1116;
            --bg-container: #161b22;
            --bg-elevation-1: #21262d;
            --primary: #58a6ff;
            --primary-hover: #79c0ff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-muted: #30363d;
            --accent-error: #f85149;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-container);
            border-bottom: 1px solid var(--border-muted);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            z-index: 100;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--primary), #1f6feb);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #ffffff;
        }

        h1 {
            font-size: 15px;
            font-weight: 600;
        }

        /* Layout Grid - Responsive across devices */
        .workspace {
            display: flex;
            flex-direction: column; /* Mobile first: Top to Bottom */
            flex-grow: 1;
            height: calc(100vh - 64px);
            position: relative;
        }

        @media (min-width: 768px) {
            .workspace {
                flex-direction: row; /* Desktop: Left to Right */
            }
        }

        /* Controls Panel */
        .control-panel {
            width: 100%;
            background-color: var(--bg-container);
            border-bottom: 1px solid var(--border-muted);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .control-panel {
                width: 320px;
                border-bottom: none;
                border-right: 1px solid var(--border-muted);
                padding: 24px;
                gap: 20px;
            }
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .file-selector-wrapper {
            position: relative;
            width: 100%;
        }

        .native-file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        .custom-upload-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--primary);
            color: #050c14;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 8px;
            transition: var(--transition-smooth);
            border: none;
            width: 100%;
        }

        /* Active Manifest Card */
        .file-card {
            background-color: var(--bg-elevation-1);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-meta-header {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            width: 100%;
        }

        .pdf-icon-box {
            background-color: rgba(248, 81, 73, 0.1);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-icon-box svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-error);
        }

        .file-details {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            width: 100%;
        }

        .file-name-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Viewport Canvas Space */
        .viewport-space {
            flex-grow: 1;
            background-color: var(--bg-surface);
            padding: 12px;
            overflow-y: auto; /* Scrollable for multi-pages */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Landing Dropzone style */
        .dropzone-container {
            border: 2px dashed var(--border-muted);
            background-color: var(--bg-container);
            border-radius: 12px;
            width: 100%;
            height: 100%;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 24px;
            text-align: center;
        }

        .dropzone-main-text {
            font-size: 15px;
            font-weight: 500;
        }

        .dropzone-sub-text {
            font-size: 12px;
            color: var(--text-secondary);
            max-width: 260px;
        }

        /* Custom PDF Canvas Viewer */
        .pdf-page-canvas {
            max-width: 100%;
            height: auto !important;
            background-color: white;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .hidden { display: none !important; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid var(--border-muted);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="brand-zone">
            <div class="brand-logo">N</div>
            <h1>NexusView</h1>
        </div>
    </header>

    <div class="workspace">
        <div class="control-panel">
            <div class="panel-title">Document Hub</div>
            
            <div class="file-selector-wrapper">
                <input type="file" id="pdf-file-handler" class="native-file-input" accept="application/pdf" />
                <button class="custom-upload-trigger">
                    <svg style="width:16px; height:16px; fill:currentColor;" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                    Upload Document
                </button>
            </div>

            <div id="active-file-tracking" class="hidden">
                <div class="panel-title" style="margin-bottom: 6px;">Active Manifest</div>
                <div class="file-card">
                    <div class="file-meta-header">
                        <div class="pdf-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                        </div>
                        <div class="file-details">
                            <div id="manifest-name" class="file-name-text">document.pdf</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="viewport-space" id="viewer-viewport">
            
            <div id="empty-state-view" class="dropzone-container">
                <div class="dropzone-main-text">Upload or Tap to choose PDF</div>
                <div class="dropzone-sub-text">Fully optimized for both Mobile screens and Desktop viewports.</div>
            </div>

            <div id="loading-state" class="hidden">
                <div class="loader"></div>
                <p style="margin-top:10px; color:var(--text-secondary); font-size:13px;">Processing pages...</p>
            </div>

            </div>
    </div>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file-handler');
        const viewport = document.getElementById('viewer-viewport');
        const emptyState = document.getElementById('empty-state-view');
        const loadingState = document.getElementById('loading-state');
        const trackingWidget = document.getElementById('active-file-tracking');
        const manifestName = document.getElementById('manifest-name');

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') return;

            manifestName.textContent = file.name;
            
            // Clean previous sessions canvas
            document.querySelectorAll('.pdf-page-canvas').forEach(el => el.remove());
            
            // Show loaders
            emptyState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            trackingWidget.classList.remove('hidden');

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                
                try {
                    // Load the PDF Document via PDF.js core
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    loadingState.classList.add('hidden');

                    // Loop through all pages and render
                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        
                        // Setup automatic scaling based on mobile viewport device width
                        const viewportScale = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page-canvas';
                        const context = canvas.getContext('2d');
                        
                        canvas.height = viewportScale.height;
                        canvas.width = viewportScale.width;
                        
                        const renderContext = {
                            canvasContext: context,
                            viewport: viewportScale
                        };
                        
                        viewport.appendChild(canvas);
                        await page.render(renderContext).promise;
                    }
                } catch (error) {
                    alert("Error processing PDF: " + error.message);
                    loadingState.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                }
            };
            
            fileReader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
