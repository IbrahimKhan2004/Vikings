<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusView // Premium Static PDF Hub</title>
    <style>
        :root {
            /* Material 3 Dark Theme Palette */
            --bg-surface: #0e1116;
            --bg-container: #161b22;
            --bg-elevation-1: #21262d;
            --primary: #58a6ff;
            --primary-hover: #79c0ff;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-muted: #30363d;
            --accent-error: #f85149;
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Application Bar */
        header {
            background-color: var(--bg-container);
            border-bottom: 1px solid var(--border-muted);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            z-index: 100;
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--primary), #1f6feb);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: #ffffff;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .meta-status {
            font-size: 12px;
            background-color: var(--bg-elevation-1);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #56d364;
            border-radius: 50%;
        }

        /* Layout Main Grid */
        .workspace {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 64px);
            position: relative;
        }

        /* Controls / File Panel */
        .control-panel {
            width: 320px;
            background-color: var(--bg-container);
            border-right: 1px solid var(--border-muted);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* Action Buttons & Custom Inputs */
        .file-selector-wrapper {
            position: relative;
            width: 100%;
        }

        .native-file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        .custom-upload-trigger {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--primary);
            color: #050c14;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 20px;
            border-radius: 8px;
            transition: var(--transition-smooth);
            text-align: center;
            border: none;
            width: 100%;
        }

        .file-selector-wrapper:hover .custom-upload-trigger {
            background-color: var(--primary-hover);
            box-shadow: 0 0 16px rgba(88, 166, 255, 0.2);
        }

        /* Tracking Active Files */
        .file-card {
            background-color: var(--bg-elevation-1);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: var(--transition-smooth);
        }

        .file-meta-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .pdf-icon-box {
            background-color: rgba(248, 81, 73, 0.1);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pdf-icon-box svg {
            width: 20px;
            height: 20px;
            fill: var(--accent-error);
        }

        .file-details {
            overflow: hidden;
        }

        .file-name-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .file-size-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Viewport Canvas Space */
        .viewport-space {
            flex-grow: 1;
            background-color: var(--bg-surface);
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Empty / Dropzone Interactive State */
        .dropzone-container {
            border: 2px dashed var(--border-muted);
            background-color: var(--bg-container);
            border-radius: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            transition: var(--transition-smooth);
            padding: 40px;
            text-align: center;
        }

        .dropzone-container.drag-over {
            border-color: var(--primary);
            background-color: rgba(88, 166, 255, 0.03);
            transform: scale(0.995);
        }

        .dropzone-icon {
            width: 64px;
            height: 64px;
            background-color: var(--bg-elevation-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-muted);
            margin-bottom: 8px;
        }

        .dropzone-icon svg {
            width: 28px;
            height: 28px;
            fill: var(--text-secondary);
            transition: var(--transition-smooth);
        }

        .dropzone-container.drag-over .dropzone-icon svg {
            fill: var(--primary);
            transform: translateY(-2px);
        }

        .dropzone-main-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .dropzone-sub-text {
            font-size: 13px;
            color: var(--text-secondary);
            max-width: 280px;
            line-height: 1.5;
        }

        /* Active PDF Iframe Layer */
        .pdf-frame-embed {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            background-color: #525659; /* Matches Chrome's internal PDF viewport background */
            display: none;
        }

        /* Helper Utilities */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-zone">
            <div class="brand-logo">N</div>
            <h1>NexusView</h1>
        </div>
        <div class="meta-status">
            <div class="status-dot"></div>
            <span>Local Engine Live</span>
        </div>
    </header>

    <div class="workspace">
        <!-- Sidebar Controls -->
        <div class="control-panel">
            <div class="panel-title">Document Hub</div>
            
            <div class="file-selector-wrapper">
                <input type="file" id="pdf-file-handler" class="native-file-input" accept="application/pdf" />
                <button class="custom-upload-trigger" tabindex="-1">
                    <svg style="width:18px; height:18px; fill:currentColor;" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                    Upload Document
                </button>
            </div>

            <!-- Active file monitoring slot -->
            <div id="active-file-tracking" class="hidden">
                <div class="panel-title" style="margin-bottom: 8px; font-size:11px;">Active Manifest</div>
                <div class="file-card">
                    <div class="file-meta-header">
                        <div class="pdf-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v1.25H7.5v-4.5H10c.83 0 1.5.67 1.5 1.5v.25zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5v-4.5H15c.83 0 1.5.67 1.5 1.5v1.5zm4-3H19v1h1.5V11H19v1.25h-1.5v-4.5h3v1.25zM9 9h1v1H9V9zm5.5 1.25h1v1.5h-1v-1.5zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
                        </div>
                        <div class="file-details">
                            <div id="manifest-name" class="file-name-text">document.pdf</div>
                            <div id="manifest-size" class="file-size-text">0.00 MB</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas Core Area -->
        <div class="viewport-space" id="interactive-drop-zone">
            
            <!-- Default Landing Dropzone -->
            <div id="empty-state-view" class="dropzone-container">
                <div class="dropzone-icon">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                </div>
                <div class="dropzone-main-text">Drag and drop your PDF here</div>
                <div class="dropzone-sub-text">Processing is isolated completely locally. Your file contents never upload to or touch a remote server.</div>
            </div>

            <!-- Dynamic Target Frame -->
            <iframe id="sandboxed-pdf-engine" class="pdf-frame-embed" title="Embedded PDF Engine Display"></iframe>

        </div>
    </div>

    <script>
        const fileInput = document.getElementById('pdf-file-handler');
        const dropZone = document.getElementById('interactive-drop-zone');
        const emptyState = document.getElementById('empty-state-view');
        const pdfIframe = document.getElementById('sandboxed-pdf-engine');
        const trackingWidget = document.getElementById('active-file-tracking');
        
        const manifestName = document.getElementById('manifest-name');
        const manifestSize = document.getElementById('manifest-size');

        // Central Execution Logic
        function renderLocalPDF(file) {
            if (!file || file.type !== 'application/pdf') {
                alert('Invalid payload. Please supply a valid document matching application/pdf framework.');
                return;
            }

            // Clean previous references to preserve memory allocation buffers
            if (pdfIframe.src) {
                URL.revokeObjectURL(pdfIframe.src);
            }

            // Parse structural metrics
            manifestName.textContent = file.name;
            manifestSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            
            // Build local sandboxed object reference pointer
            const objectSecureUrl = URL.createObjectURL(file);
            
            // Swap display trees smoothly
            emptyState.classList.add('hidden');
            trackingWidget.classList.remove('hidden');
            pdfIframe.style.display = 'block';
            
            // Render inside optimized native browser context
            pdfIframe.src = objectSecureUrl;
        }

        // Connect Input Handlers
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                renderLocalPDF(e.target.files[0]);
            }
        });

        // Drag & Drop Boundary Integrations
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                emptyState.classList.add('drag-over');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                emptyState.classList.remove('drag-over');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const transferData = e.dataTransfer;
            const operationalFiles = transferData.files;
            
            if (operationalFiles.length > 0) {
                renderLocalPDF(operationalFiles[0]);
            }
        }, false);
    </script>
</body>
</html>
