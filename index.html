<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusView // AMOLED Glassmorphic Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            /* True AMOLED Dark Minimalist Scheme */
            --bg-amoled: #000000;
            --bg-surface: #05070a;
            --glass-bg: rgba(18, 22, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #3894ff;
            --primary-glow: rgba(56, 148, 255, 0.3);
            --text-main: #f0f3f6;
            --text-muted: #8c97a4;
            --accent-red: #ff5252;
            --blur-strength: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
            background-color: var(--bg-amoled);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphic Navigation Header - Auto Collapsible */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-strength));
            -webkit-backdrop-filter: blur(var(--blur-strength));
            border-bottom: 1px solid var(--glass-border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: sticky;
            top: 0;
            flex-shrink: 0;
        }

        body.pdf-active header {
            transform: translateY(-100%);
            position: absolute;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-cube {
            background: linear-gradient(135deg, var(--primary), #0052cc);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 11px;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }

        /* Trigger for History Drawer */
        .history-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Master View Grid Layout */
        .app-workspace {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 64px);
            position: relative;
            transition: height 0.4s;
        }

        body.pdf-active .app-workspace {
            height: 100vh;
        }

        /* Floating Recents Drawer (Glassmorphic Slide-out) */
        .recents-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--glass-border);
            z-index: 150;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .recents-drawer.open {
            transform: translateX(0);
        }

        .drawer-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 800;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: rgba(56, 148, 255, 0.1);
            border-color: var(--primary);
        }

        /* Centered Floating Control Hub when no document loaded */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 32px 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            z-index: 10;
        }

        .file-input-container {
            position: relative;
            margin-top: 20px;
        }

        .real-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .glass-btn {
            background: linear-gradient(135deg, var(--primary), #1a73e8);
            border: none; color: #fff;
            padding: 14px 28px;
            font-weight: 600; font-size: 14px;
            border-radius: 10px; width: 100%;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Immersive Canvas Workspace */
        .pdf-render-canvas-stream {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-amoled);
            scroll-behavior: smooth;
        }

        /* Hidden controls overlay that triggers on tap */
        .floating-action-overlay {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 300;
            display: none;
        }

        body.pdf-active .floating-action-overlay {
            display: flex;
        }

        .action-circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .pdf-page-canvas-node {
            width: 100%;
            max-width: 100%;
            height: auto !important;
            margin-bottom: 2px; /* Super seamless stitching stack */
            background-color: #121212;
        }

        .hidden { display: none !important; }

        /* Loader */
        .spinner {
            border: 2px solid rgba(255,255,255,0.05);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header id="app-header">
        <div class="brand">
            <div class="logo-cube">N</div>
            <h1>NexusView</h1>
        </div>
        <button class="history-toggle-btn" id="toggle-recents-view">
            <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            Recents
        </button>
    </header>

    <div class="app-workspace">
        <div class="recents-drawer" id="recents-sidebar">
            <div class="drawer-title">Last 10 Manifests</div>
            <div class="history-list" id="history-render-root">
                <div class="history-item" style="color:var(--text-muted); text-align:center;pointer-events:none;">No history available</div>
            </div>
        </div>

        <div class="center-hub" id="upload-hub-interface">
            <h2 style="font-size: 18px; margin-bottom: 8px;">Immersive View Mode</h2>
            <p style="font-size: 13px; color: var(--text-muted);">Select or drag any PDF to launch deep black native canvas pipeline.</p>
            
            <div class="file-input-container">
                <input type="file" id="pdf-file-handler" class="real-input" accept="application/pdf" />
                <button class="glass-btn">Select PDF File</button>
            </div>
            <div id="processing-loader" class="hidden">
                <div class="spinner"></div>
                <p style="font-size:12px; color:var(--text-muted)">Generating isolated page matrix...</p>
            </div>
        </div>

        <div class="pdf-render-canvas-stream" id="stream-viewport"></div>
    </div>

    <div class="floating-action-overlay">
        <div class="action-circle-btn" id="exit-fullscreen-trigger" title="Close Document">
            <svg style="width:20px;height:20px;fill:var(--text-main)" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file-handler');
        const viewport = document.getElementById('stream-viewport');
        const uploadHub = document.getElementById('upload-hub-interface');
        const loader = document.getElementById('processing-loader');
        const toggleRecents = document.getElementById('toggle-recents-view');
        const recentsSidebar = document.getElementById('recents-sidebar');
        const historyRenderRoot = document.getElementById('history-render-root');
        const exitBtn = document.getElementById('exit-fullscreen-trigger');

        let db;
        // Open IndexedDB to store actual file blobs locally
        const dbRequest = indexedDB.open("NexusViewDB", 1);
        dbRequest.onupgradeneeded = (e) => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("pdf_history")) {
                db.objectStoreStore("pdf_history", { keyPath: "id", autoIncrement: true });
            }
        };
        dbRequest.onsuccess = (e) => {
            db = e.target.result;
            renderHistoryList();
        };

        // UI View State Toggle Handlers
        toggleRecents.addEventListener('click', (e) => {
            e.stopPropagation();
            recentsSidebar.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!recentsSidebar.contains(e.target) && e.target !== toggleRecents) {
                recentsSidebar.classList.remove('open');
            }
        });

        exitBtn.addEventListener('click', () => {
            document.body.classList.remove('pdf-active');
            uploadHub.classList.remove('hidden');
            viewport.innerHTML = '';
            fileInput.value = '';
        });

        // Pipeline Logic For Rendering PDF
        async function processPDFBlob(fileBlob, fileName, saveToHistory = true) {
            if (!fileBlob) return;
            
            loader.classList.remove('hidden');
            recentsSidebar.classList.remove('open');
            viewport.innerHTML = '';

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    
                    loader.classList.add('hidden');
                    uploadHub.classList.add('hidden');
                    document.body.classList.add('pdf-active');

                    // Sequential Frame Injection Flow
                    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                        const page = await pdf.getPage(pageNum);
                        const baseViewport = page.getViewport({ scale: 1.0 });
                        
                        // Adaptive display calculations to eliminate scaling blur across phone viewports
                        const deviceScreenWidth = window.innerWidth;
                        const dynamicScale = deviceScreenWidth / baseViewport.width;
                        const optimizedViewport = page.getViewport({ scale: Math.max(dynamicScale, 1.5) });

                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page-canvas-node';
                        const context = canvas.getContext('2d');
                        
                        canvas.height = optimizedViewport.height;
                        canvas.width = optimizedViewport.width;
                        
                        viewport.appendChild(canvas);
                        await page.render({ canvasContext: context, viewport: optimizedViewport }).promise;
                    }

                    if(saveToHistory) {
                        storeInIndexedDB(fileBlob, fileName);
                    }

                } catch (err) {
                    alert("Pipeline rendering fault: " + err.message);
                    loader.classList.add('hidden');
                }
            };
            fileReader.readAsArrayBuffer(fileBlob);
        }

        // Handle native dynamic file collection
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                processPDFBlob(e.target.files[0], e.target.files[0].name, true);
            }
        });

        // Local Storage Architecture using IndexedDB (Handles Last 10 records)
        function storeInIndexedDB(blob, name) {
            if (!db) return;
            const transaction = db.transaction(["pdf_history"], "readwrite");
            const store = transaction.objectStore("pdf_history");

            // Fetch current historical count logs
            store.getAll().onsuccess = (e) => {
                let records = e.target.result;
                // De-duplicate matching manifests
                const existingIndex = records.findIndex(r => r.name === name);
                if(existingIndex !== -1) {
                    store.delete(records[existingIndex].id);
                }

                // Push new file manifest record details
                store.add({ name: name, binaryData: blob, timestamp: Date.now() });

                // Cap total layout cache ceiling cleanly at 10 items Max
                if(records.length >= 10) {
                    store.delete(records[0].id);
                }
                renderHistoryList();
            };
        }

        function renderHistoryList() {
            if(!db) return;
            const store = db.transaction(["pdf_history"], "readonly").objectStore("pdf_history");
            store.getAll().onsuccess = (e) => {
                const results = e.target.result.sort((a,b) => b.timestamp - a.timestamp);
                if(results.length === 0) return;

                historyRenderRoot.innerHTML = '';
                results.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'history-item';
                    el.textContent = item.name;
                    el.title = `Click to quick reload: ${item.name}`;
                    el.addEventListener('click', () => {
                        processPDFBlob(item.binaryData, item.name, false);
                    });
                    historyRenderRoot.appendChild(el);
                });
            };
        }
    </script>
</body>
</html>
